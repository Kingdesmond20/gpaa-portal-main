
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta name="description" content="The official professional association for Physician Assistants in Ghana. Advancing clinical excellence, professional development, and quality healthcare delivery nationwide since 1980."/>
    <title>GPAA - Ghana Physician Assistants Association</title>
    <link rel="icon" type="image/png" href="/images/gpaa_logo.png"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/index.css">
<script>
  (function () {
    try {
      var stored = localStorage.getItem('gpaa-theme');
      var isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (isDark) document.documentElement.classList.add('dark');
    } catch (e) {}
  })();
</script>
</head>
<body class="bg-background-light dark:bg-[#0c0f12] text-[#111418] dark:text-gray-100 font-display">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
